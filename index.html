<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HR Recruitment Approval System V6</title>

<script>tailwind.config={theme:{extend:{colors:{primary:'#165DFF',secondary:'#36CFC8',success:'#00B42A',warning:'#FF7D00',danger:'#F53F3F',sidebar:'#30363D',bg:'#F6F8FA'}}}}</script>
</head><body class="bg-[#f6f8fa] text-[#1d2129] font-sans">

<script>
const LINK_GOOGLE_SHEET_API="https://script.google.com/macros/s/AKfycbzzLfZ1FIZe3fFNjwdds99Lex4_h2waPoU73ZLCOgX8gtFRYxbEd9jeFFlFhO-BM1I1/exec";
const STAGES=[{key:'NEW_APPLICANT',label:'New Applicant',icon:'fa-user-plus',desc:'Data calon pelamar baru sebelum diteruskan ke HR Interview'},{key:'DATABASE',label:'Database',icon:'fa-database',desc:'Verifikasi administrasi & kelengkapan data kandidat'},{key:'HR_INTERVIEW',label:'On HR Interview',icon:'fa-comments',desc:'Penilaian interview HR'},{key:'USER_INTERVIEW',label:'On User Interview',icon:'fa-user-circle-o',desc:'Persetujuan user/owner posisi'},{key:'PSIKOTEST_BG',label:'Psikotest & BG Check',icon:'fa-check-square-o',desc:'Psikotest, referensi & background check'},{key:'OFFER_LETTER',label:'Offer Letter',icon:'fa-file-text-o',desc:'Final approval & surat penawaran'},{key:'T_POOL',label:'T-Pool',icon:'fa-star-o',desc:'Kandidat cadangan / talent pool'}];
const USERS=[{username:'tasya',password:'123',name:'Administrator Tasya',role:'ADMIN',label:'Administrator'},{username:'hr',password:'hr123',name:'HR Interviewer',role:'HR',label:'HR Interview'},{username:'user',password:'user123',name:'User Interviewer',role:'USER',label:'User Interview'},{username:'checker',password:'checker123',name:'Checker',role:'CHECKER',label:'Psikotest & BG Check'},{username:'approver',password:'appr123',name:'Offer Approver',role:'APPROVER',label:'Offer Letter'}];
const stageRole={NEW_APPLICANT:['ADMIN','HR'],DATABASE:['ADMIN','HR'],HR_INTERVIEW:['ADMIN','HR'],USER_INTERVIEW:['ADMIN','USER'],PSIKOTEST_BG:['ADMIN','CHECKER'],OFFER_LETTER:['ADMIN','APPROVER'],T_POOL:['ADMIN','HR','USER']};
let state={user:null,candidates:[],employees:[],logs:[],notifs:[],currentStage:'NEW_APPLICANT',currentCandidateId:null,chart:null,bpjsKes:[],bpjsTK:[],inactivePopupShown:false,adjustmentPeriod:'',adjustmentArea:'ALL',adjustmentQuery:'',adjustmentType:'IN'};
const seedCandidates=[];
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){console.warn('LocalStorage gagal',k,e);return false}}
function safeGet(k,f=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){console.warn('LocalStorage rusak',k,e);return f}}
function saveAll(){safeSet('hr_v3_candidates',state.candidates);safeSet('hr_v3_employees',state.employees);safeSet('hr_v3_logs',state.logs);safeSet('hr_v3_notifs',state.notifs);safeSet('hr_v3_bpjsKes',state.bpjsKes);safeSet('hr_v3_bpjsTK',state.bpjsTK)}
function normalizeCandidate(c){return{...c,id:c.id??(Date.now()+Math.floor(Math.random()*1000)),nama:c.nama||c.NAMA||'',kontak:c.kontak||c.NO_HP||'',posisi:c.posisi||c.jabatan||c.POSISI||'',departemen:c.departemen||c.DEPARTMENT||'',penempatan:c.penempatan||c.LOKASI_KERJA||'',email:c.email||c.EMAIL_PRIBADI||'',source:c.source||'Legacy',createdAt:c.createdAt||new Date().toISOString(),stage:c.stage||((c.talent==='Diterima')?'T_POOL':'NEW_APPLICANT'),stageHistory:Array.isArray(c.stageHistory)?c.stageHistory:[],profile:c.profile||{},backgroundCheck:c.backgroundCheck||{status:'PENDING',identity:'PENDING',education:'PENDING',employment:'PENDING',reference:'PENDING',criminal:'PENDING',notes:'Belum dilakukan.'},status:c.status||'ACTIVE_PROCESS'}}
function loadAll(){const c=safeGet('hr_v3_candidates');state.candidates=Array.isArray(c)?c.map(normalizeCandidate):[];state.employees=safeGet('hr_v3_employees',[])||[];state.logs=safeGet('hr_v3_logs',[])||[];state.notifs=safeGet('hr_v3_notifs',[])||[];state.bpjsKes=safeGet('hr_v3_bpjsKes',[])||[];state.bpjsTK=safeGet('hr_v3_bpjsTK',[])||[];const old=localStorage.getItem('servvo_hr_karyawan');if(old&&!localStorage.getItem('hr_v3_imported_legacy')){try{const legacy=JSON.parse(old);if(Array.isArray(legacy))legacy.forEach(x=>{const c=normalizeCandidate(x);if(!state.candidates.some(y=>String(y.id)===String(c.id)))state.candidates.push(c)});localStorage.setItem('hr_v3_imported_legacy','1')}catch(e){}}state.employees.forEach(e=>{if(!e.AREA_TYPE)e.AREA_TYPE=inferAreaType(e);if(e.STATUS_PEGAWAI==='NONAKTIF'&&!e.TGL_KELUAR)e.TGL_KELUAR=String(e.statusUpdatedAt||'').slice(0,10)});if(!state.adjustmentPeriod)state.adjustmentPeriod=currentPeriodKey();saveAll()}
function esc(v){return String(v??'').replace(/[&<>'"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[s]))}
function now(){return new Date().toISOString()} function pad2(n){return String(n).padStart(2,'0')} function currentPeriodKey(){const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`}
function periodBounds(key){const [y,m]=key.split('-').map(Number),first=new Date(y,m-1,1),prev=new Date(y,m-2,1);return{start:`${prev.getFullYear()}-${pad2(prev.getMonth()+1)}-19`,end:`${y}-${pad2(m)}-20`,label:first.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}}
function periodLabel(k){return periodBounds(k).label} function getJoinDate(e){return String(e?.TGL_JOIN||'').slice(0,10)} function getExitDate(e){return String(e?.TGL_KELUAR||e?.TGL_NONAKTIF||((e?.STATUS_PEGAWAI==='NONAKTIF')?e?.statusUpdatedAt:'')||'').slice(0,10)}
function inferAreaType(e){const text=[e.AREA_TYPE,e.LOKASI_KERJA,e.DEPARTMENT,e.DIRECTORATE,e.DIVISION,e.DEPT_DETAIL].filter(Boolean).join(' ').toLowerCase();if(/factory|pabrik|plant|manufactur|produksi|production/.test(text))return'Factory';if(/depo|depot|warehouse|gudang|distribution|distribusi/.test(text))return'Depo';if(/regional office|\bro\b|regional/.test(text))return'RO';if(/head office|\bho\b|headquarter|kantor pusat|corporate|pusat/.test(text))return'HO';return e.AREA_TYPE||'HO'}
function areaType(e){return e?.AREA_TYPE||inferAreaType(e)} function isDateInPeriod(d,k){if(!d||!k)return false;const b=periodBounds(k);return d>=b.start&&d<=b.end}
function adjustmentRows(t){return state.employees.filter(e=>{const d=t==='IN'?getJoinDate(e):getExitDate(e);return isDateInPeriod(d,state.adjustmentPeriod)&&(state.adjustmentArea==='ALL'||areaType(e)===state.adjustmentArea)&&[e.NIK,e.NAMA,e.POSISI,e.DEPARTMENT,e.LOKASI_KERJA,areaType(e)].join(' ').toLowerCase().includes((state.adjustmentQuery||'').toLowerCase())&&(t==='OUT'?e.STATUS_PEGAWAI==='NONAKTIF':true)})}
function toast(msg,type='info'){const el=document.getElementById('toast');if(!el)return;el.innerHTML=`<div class="text-white px-4 py-3 rounded-xl shadow-lg text-sm font-semibold ${type==='success'?'bg-green-600':type==='error'?'bg-red-600':type==='warning'?'bg-orange-500':'bg-gray-800'}">${esc(msg)}</div>`;el.classList.remove('hidden');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.add('hidden'),2800)}
function notify(msg,type='info'){state.notifs.unshift({id:Date.now()+Math.random(),msg,type,at:now(),read:false});state.notifs=state.notifs.slice(0,200);saveAll()}
function log(a,d){state.logs.unshift({at:now(),action:a,detail:d,user:state.user?.name||'System'});state.logs=state.logs.slice(0,500);saveAll()}
function canAct(stage){return !!state.user&&(state.user.role==='ADMIN'||(stageRole[stage]||[]).includes(state.user.role))}function stageName(k){return STAGES.find(s=>s.key===k)?.label||k}
function toggleSidebar(){document.getElementById('sidebar')?.classList.toggle('open');document.getElementById('overlay')?.classList.toggle('hidden')}
function buildApp(){document.getElementById('root').innerHTML=`<div id="toast" class="fixed top-4 right-4 z-[300] hidden"></div><div id="loginScreen" class="fixed inset-0 z-[250] bg-[#eef1f5] flex items-center justify-center p-4"><div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md"><div class="text-center mb-6"><div class="w-16 h-16 mx-auto rounded-2xl bg-primary text-white flex items-center justify-center text-3xl"><i class="fa fa-users"></i></div><h1 class="text-2xl font-black mt-4">HR Recruitment Approval</h1><p class="text-sm text-gray-500">Recruitment, Employee, BPJS & Adjustment</p></div><form id="loginForm" class="space-y-4"><input id="loginUser" class="w-full border rounded-xl px-3 py-3" placeholder="Username" required><input id="loginPass" type="password" class="w-full border rounded-xl px-3 py-3" placeholder="Password" required><div id="loginErr" class="hidden text-red-600 bg-red-50 rounded-xl p-3 text-sm">Username atau password salah.</div><button class="w-full bg-primary text-white rounded-xl py-3 font-bold">Masuk Sistem</button></form><div class="mt-5 p-4 bg-gray-50 rounded-xl text-xs text-gray-600"><b>Akun demo:</b><br>tasya / 123<br>hr / hr123<br>user / user123<br>checker / checker123<br>approver / appr123</div></div></div><div id="app" class="hidden min-h-screen"><div class="md:hidden bg-sidebar text-white p-4 flex justify-between"><b>HR RECRUITMENT</b><button onclick="toggleSidebar()" class="text-xl"><i class="fa fa-bars"></i></button></div><aside id="sidebar" class="fixed left-0 top-0 bottom-0 w-[300px] bg-sidebar text-white z-[200] shadow-xl desktop-sidebar"><div class="p-5 border-b border-white/10"><div class="font-black text-lg">HR RECRUITMENT</div><div class="text-xs text-gray-400">Approval Workflow System</div><div class="mt-4 p-3 bg-black/15 rounded-xl"><div id="activeUserName" class="font-bold"></div><div id="activeUserRole" class="text-xs text-gray-400"></div><button onclick="logout()" class="mt-2 text-red-300 text-xs"><i class="fa fa-sign-out"></i> Logout</button></div></div><div class="p-3"><button class="w-full menu-item active" data-page="dashboard"><i class="fa fa-dashboard"></i> Dashboard</button></div><div class="px-4 text-[10px] uppercase tracking-widest text-gray-500 font-bold">Recruitment Workflow</div><nav id="workflowMenu" class="p-3"></nav><div class="px-4 pt-3 text-[10px] uppercase tracking-widest text-gray-500 font-bold">Personalia & BPJS</div><div class="p-3"><button class="w-full menu-item" data-page="employees"><i class="fa fa-id-card-o"></i> Database Karyawan</button><button class="w-full menu-item" data-page="bpjsKes"><i class="fa fa-heartbeat"></i> BPJS Kesehatan <span id="badgeBpjsKes" class="ml-auto"></span></button><button class="w-full menu-item" data-page="bpjsTK"><i class="fa fa-briefcase"></i> BPJS TK <span id="badgeBpjsTK" class="ml-auto"></span></button></div><div class="px-4 pt-3 text-[10px] uppercase tracking-widest text-gray-500 font-bold">Adjustment</div><div class="p-3"><button class="w-full menu-item" data-page="adjustmentIn"><i class="fa fa-sign-in"></i> Adjustment IN <span id="badgeAdjIn" class="ml-auto"></span></button><button class="w-full menu-item" data-page="adjustmentOut"><i class="fa fa-sign-out"></i> Adjustment OUT <span id="badgeAdjOut" class="ml-auto"></span></button></div><div class="px-3 py-3 border-t border-white/10"><button class="w-full menu-item" data-page="logs"><i class="fa fa-history"></i> Log Aktivitas</button></div></aside><div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-[190] hidden md:hidden"></div><main class="md:ml-[300px] p-4 md:p-8"><div id="page-dashboard" class="page"></div><div id="page-stage" class="page hidden"></div><div id="page-candidate" class="page hidden"></div><div id="page-employees" class="page hidden"></div><div id="page-bpjsKes" class="page hidden"></div><div id="page-bpjsTK" class="page hidden"></div><div id="page-adjustmentIn" class="page hidden"></div><div id="page-adjustmentOut" class="page hidden"></div><div id="page-logs" class="page hidden"></div></main></div>`;document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();login()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDuplicateModal();closeInactiveModal()}})}
function login(){const u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value,acc=USERS.find(x=>x.username===u&&x.password===p);if(!acc){document.getElementById('loginErr').classList.remove('hidden');return}state.user=acc;sessionStorage.setItem('hr_v6_session',JSON.stringify({username:acc.username}));document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadAll();log('LOGIN',`Login ${acc.name}`);notify(`Selamat datang, ${acc.name}.`,'success');buildWorkflowMenu();navigate('dashboard');setTimeout(()=>openInactiveBpjsPopup(false),350);cloudRead()}
function restore(){try{const s=JSON.parse(sessionStorage.getItem('hr_v6_session')||'null');const acc=USERS.find(x=>x.username===s?.username);if(acc){state.user=acc;document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadAll();document.getElementById('activeUserName').innerText=acc.name;document.getElementById('activeUserRole').innerText=acc.label;buildWorkflowMenu();navigate('dashboard');setTimeout(()=>openInactiveBpjsPopup(false),350);cloudRead()}}catch(e){}}
function logout(){log('LOGOUT',`Logout ${state.user?.name||''}`);sessionStorage.removeItem('hr_v6_session');location.reload()}
function buildWorkflowMenu(){const nav=document.getElementById('workflowMenu');nav.innerHTML=STAGES.map(s=>`<button class="w-full text-left rounded-xl px-4 py-3 my-1 hover:bg-white/10 ${state.currentStage===s.key?'bg-white/10':''}" onclick="openStage('${s.key}')"><div class="flex items-center gap-3"><span class="w-8 h-8 rounded-full border flex items-center justify-center"><i class="fa ${s.icon}"></i></span><span class="flex-1"><b class="block">${esc(s.label)}</b><span class="text-[10px] text-gray-400">${esc(s.desc)}</span></span><span class="text-xs">${state.candidates.filter(c=>c.stage===s.key&&c.status==='ACTIVE_PROCESS').length}</span></div></button>`).join('')}
function navigate(page){document.querySelectorAll('.page').forEach(p=>{p.classList.remove('active');p.classList.add('hidden')});const el=document.getElementById('page-'+page);if(el){el.classList.remove('hidden');el.classList.add('active')}document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='dashboard')renderDashboard();if(page==='employees')renderEmployees();if(page==='bpjsKes')renderBpjs('KES');if(page==='bpjsTK')renderBpjs('TK');if(page==='adjustmentIn'){state.adjustmentType='IN';renderAdjustment('IN')}if(page==='adjustmentOut'){state.adjustmentType='OUT';renderAdjustment('OUT')}if(page==='logs')renderLogs();if(window.innerWidth<768){document.getElementById('sidebar')?.classList.remove('open');document.getElementById('overlay')?.classList.add('hidden')}}

function pendingForUser(){return state.candidates.filter(c=>c.status==='ACTIVE_PROCESS'&&canAct(c.stage))}
function renderDashboard(){const total=state.candidates.length,active=state.candidates.filter(c=>c.status==='ACTIVE_PROCESS').length,hired=state.employees.length,non=state.employees.filter(e=>e.STATUS_PEGAWAI==='NONAKTIF').length,adjIn=adjustmentRows('IN').length,adjOut=adjustmentRows('OUT').length;document.getElementById('page-dashboard').innerHTML=`<div class="mb-6"><h1 class="text-3xl font-black">Dashboard HR</h1><p class="text-sm text-gray-500 mt-1">Monitoring seluruh proses recruitment, karyawan, BPJS dan adjustment.</p></div><div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"><div class="cardx"><div>Total Kandidat</div><b>${total}</b></div><div class="cardx"><div>Dalam Proses</div><b class="text-warning">${active}</b></div><div class="cardx"><div>Karyawan</div><b class="text-primary">${hired}</b></div><div class="cardx"><div>Nonaktif</div><b class="text-danger">${non}</b></div></div><div class="grid md:grid-cols-3 gap-4"><div class="cardx"><div class="font-bold">Adjustment IN</div><div class="text-3xl font-black text-success mt-2">${adjIn}</div><button class="mt-3 bg-primary text-white rounded-lg px-3 py-2 text-xs" onclick="navigate('adjustmentIn')">Buka</button></div><div class="cardx"><div class="font-bold">Adjustment OUT</div><div class="text-3xl font-black text-danger mt-2">${adjOut}</div><button class="mt-3 bg-primary text-white rounded-lg px-3 py-2 text-xs" onclick="navigate('adjustmentOut')">Buka</button></div><div class="cardx"><div class="font-bold">Menunggu Aksi Anda</div><div class="mt-3 space-y-2">${pendingForUser().slice(0,5).map(c=>`<button class="w-full text-left p-3 rounded-xl border hover:bg-gray-50" onclick="openCandidate(${c.id})"><b>${esc(c.nama)}</b><div class="text-xs text-gray-500">${esc(stageName(c.stage))}</div></button>`).join('')||'<div class="text-sm text-gray-400">Tidak ada pending.</div>'}</div></div></div>`}
function renderStage(){const s=STAGES.find(x=>x.key===state.currentStage)||STAGES[0],rows=state.candidates.filter(c=>c.stage===s.key&&c.status==='ACTIVE_PROCESS'),can=canAct(s.key);document.getElementById('page-stage').innerHTML=`<div class="mb-5 flex flex-col md:flex-row md:justify-between gap-3"><div><div class="text-xs uppercase tracking-widest text-gray-500">Recruitment Workflow</div><h1 class="text-3xl font-black">${esc(s.label)}</h1><p class="text-sm text-gray-500 mt-1">${esc(s.desc)}</p></div>${s.key==='NEW_APPLICANT'?'<button class="bg-primary text-white rounded-xl px-4 py-3 font-bold" onclick="openNewCandidate()"><i class="fa fa-plus"></i> New Applicant</button>':''}</div><div class="bg-white rounded-2xl border overflow-auto"><table class="w-full min-w-[1150px] text-sm"><thead><tr class="bg-gray-50 text-xs uppercase text-gray-500"><th class="p-4 text-left">Kandidat</th><th class="p-4 text-left">Posisi</th><th class="p-4 text-left">Department</th><th class="p-4 text-left">Penempatan</th><th class="p-4 text-left">Status</th><th class="p-4 text-left">History</th><th class="p-4">Aksi</th></tr></thead><tbody>${rows.map(c=>stageRow(c,can)).join('')||'<tr><td colspan="7" class="p-12 text-center text-gray-400">Tidak ada kandidat pada tahap ini.</td></tr>'}</tbody></table></div>`}
function stageRow(c,can){const last=c.stageHistory?.slice(-1)[0];return `<tr class="border-t"><td class="p-4"><b>${esc(c.nama)}</b><div class="text-xs text-gray-500">${esc(c.kontak)} · ${esc(c.email||'')}</div></td><td class="p-4">${esc(c.posisi)}</td><td class="p-4">${esc(c.departemen)}</td><td class="p-4">${esc(c.penempatan)}</td><td class="p-4">${esc(stageName(c.stage))}</td><td class="p-4 text-xs">${last?esc(last.status)+' · '+fmtDate(last.at):'Belum diproses'}</td><td class="p-4"><div class="flex flex-wrap gap-2 justify-center"><button class="btnx" onclick="openCandidate(${c.id})"><i class="fa fa-eye"></i> Detail</button>${can?approvalButtons(c):''}</div></td></tr>`}
function approvalButtons(c){return `<button class="btnx green" onclick="actionCandidate(${c.id},'APPROVE')">Approve</button><button class="btnx orange" onclick="actionCandidate(${c.id},'RETURN')">Return</button><button class="btnx red" onclick="actionCandidate(${c.id},'REJECT')">Reject</button>`}
function openNewCandidate(){openModal('New Applicant','Tahap awal kandidat sebelum On HR Interview',`<div class="grid md:grid-cols-2 gap-4"><div><label>Nama *</label><input id="f_nama" class="fieldx"></div><div><label>Nomor HP *</label><input id="f_kontak" class="fieldx"></div><div><label>Email</label><input id="f_email" class="fieldx"></div><div><label>Posisi *</label><input id="f_posisi" class="fieldx"></div><div><label>Departemen *</label><input id="f_dept" class="fieldx"></div><div><label>Penempatan</label><input id="f_place" class="fieldx"></div><div><label>Pendidikan</label><input id="f_edu" class="fieldx"></div><div><label>Tempat Lahir</label><input id="f_birth_place" class="fieldx"></div><div><label>Tanggal Lahir</label><input id="f_birth" type="date" class="fieldx"></div><div><label>No. KTP</label><input id="f_ktp" class="fieldx"></div><div class="md:col-span-2"><label>Alamat</label><textarea id="f_address" class="fieldx"></textarea></div><div class="md:col-span-2"><label>Pengalaman Kerja</label><input id="f_exp" class="fieldx"></div><div class="md:col-span-2"><label>Catatan</label><textarea id="f_note" class="fieldx"></textarea></div></div>`,`<button class="btnx" onclick="closeModal()">Batal</button><button class="btnx primary" onclick="createCandidate()">Simpan</button>`)}
function cleanPhone(v){return String(v||'').replace(/\D/g,'')}function showDuplicateModal(newName,newPhone,old){document.getElementById('dupNewName').innerText=newName;document.getElementById('dupNewPhone').innerText=newPhone;document.getElementById('dupOldName').innerText=old?.nama||old?.NAMA||'-';document.getElementById('dupOldPhone').innerText=old?.kontak||old?.NO_HP||'-';document.getElementById('duplicateDesc').innerHTML='Nama dan nomor HP <b>sama persis</b> dengan data yang sudah terdaftar.';document.getElementById('dupOpenBtn').onclick=()=>{closeDuplicateModal();openCandidate(old.id||old.employeeId)};document.getElementById('duplicateModal').classList.remove('hidden');document.getElementById('duplicateModal').classList.add('flex')}
function createCandidate(){const nama=document.getElementById('f_nama').value.trim(),kontak=document.getElementById('f_kontak').value.trim(),posisi=document.getElementById('f_posisi').value.trim(),dept=document.getElementById('f_dept').value.trim();if(!nama||!kontak||!posisi||!dept)return toast('Lengkapi data wajib kandidat.','warning');const n=v=>String(v||'').trim().toLowerCase(),p=cleanPhone;const exact=state.candidates.find(c=>n(c.nama)===n(nama)&&p(c.kontak)===p(kontak))||state.employees.find(e=>n(e.NAMA)===n(nama)&&p(e.NO_HP)===p(kontak));if(exact){showDuplicateModal(nama,kontak,exact);return}const similar=state.candidates.find(c=>n(c.nama)===n(nama)||p(c.kontak)===p(kontak));if(similar){showDuplicateModal(nama,kontak,similar);return}const c={id:Date.now()+Math.floor(Math.random()*1000),nama,kontak,email:document.getElementById('f_email').value.trim(),posisi,departemen:dept,penempatan:document.getElementById('f_place').value.trim(),source:'New Applicant',createdAt:now(),stage:'NEW_APPLICANT',stageHistory:[],profile:{pendidikan:document.getElementById('f_edu').value.trim(),tempatLahir:document.getElementById('f_birth_place').value.trim(),tanggalLahir:document.getElementById('f_birth').value,ktp:document.getElementById('f_ktp').value.trim(),alamat:document.getElementById('f_address').value.trim(),pengalaman:document.getElementById('f_exp').value.trim()},backgroundCheck:{status:'PENDING',identity:'PENDING',education:'PENDING',employment:'PENDING',reference:'PENDING',criminal:'PENDING',notes:'Belum dilakukan.'},initialNote:document.getElementById('f_note').value.trim(),status:'ACTIVE_PROCESS'};state.candidates.unshift(c);saveAll();log('CREATE NEW APPLICANT',`Mendaftarkan ${nama}`);notify(`${nama} masuk New Applicant.`,'success');cloud({action:'CREATE_CANDIDATE',data:c});closeModal();buildWorkflowMenu();openStage('NEW_APPLICANT')}
function actionCandidate(id,action){const c=state.candidates.find(x=>String(x.id)===String(id));if(!c||!canAct(c.stage))return toast('Anda tidak memiliki hak aksi pada tahap ini.','error');if(c.stage==='T_POOL'&&action!=='REJECT')return toast('T-Pool adalah tahap akhir.','warning');if(action==='APPROVE'&&c.stage==='OFFER_LETTER')return openOffer(id,true);openModal(action==='APPROVE'?'Approve Kandidat':action==='RETURN'?'Return Kandidat':'Reject Kandidat',stageName(c.stage),`<div class="mb-4 p-4 rounded-xl bg-gray-50"><b>${esc(c.nama)}</b><div class="text-xs text-gray-500 mt-1">${action==='APPROVE'?'Kandidat dilanjutkan ke tahap berikutnya.':action==='RETURN'?'Kandidat dikembalikan ke tahap sebelumnya.':'Kandidat akan ditolak.'}</div></div><label>Catatan *</label><textarea id="actionNote" class="fieldx" rows="4"></textarea>`,`<button class="btnx" onclick="closeModal()">Batal</button><button class="btnx ${action==='APPROVE'?'green':action==='RETURN'?'orange':'red'}" onclick="applyAction(${id},'${action}')">Konfirmasi</button>`)}
function applyAction(id,action){const c=state.candidates.find(x=>String(x.id)===String(id));const note=document.getElementById('actionNote')?.value.trim();if(!c||!note)return toast('Catatan wajib diisi.','warning');const old=c.stage;c.stageHistory=c.stageHistory||[];c.stageHistory.push({stage:old,status:action==='APPROVE'?'APPROVED':action==='REJECT'?'REJECTED':'RETURNED',by:state.user.name,at:now(),note});if(action==='APPROVE'){if(old==='NEW_APPLICANT'||old==='DATABASE')c.stage='HR_INTERVIEW';else{const next=STAGES[stageIndex(old)+1];if(next)c.stage=next.key}}else if(action==='RETURN'){if(old==='HR_INTERVIEW')c.stage='NEW_APPLICANT';else if(stageIndex(old)>0)c.stage=STAGES[stageIndex(old)-1].key}else{c.status='REJECTED';c.rejectedAt=now();c.rejectedBy=state.user.name}saveAll();log(`${action} ${old}`,`${c.nama}: ${note}`);notify(`${c.nama}: ${action} di ${stageName(old)}.`,action==='APPROVE'?'success':action==='REJECT'?'error':'warning');cloud({action:'APPROVAL',data:{candidate:c.id,stage:old,decision:action,note,by:state.user.username,nextStage:c.stage}});closeModal();buildWorkflowMenu();openCandidate(c.id)}
function stageIndex(k){return STAGES.findIndex(s=>s.key===k)}function openCandidate(id){const c=state.candidates.find(x=>String(x.id)===String(id));if(!c)return;openModal('Profile Calon Pelamar',`${esc(c.nama)} · ${esc(c.kontak)}`,`<div class="grid md:grid-cols-2 gap-4"><div><b>Posisi</b><div>${esc(c.posisi)}</div></div><div><b>Department</b><div>${esc(c.departemen)}</div></div><div><b>Penempatan</b><div>${esc(c.penempatan||'-')}</div></div><div><b>Status Tahap</b><div>${esc(stageName(c.stage))}</div></div><div><b>Email</b><div>${esc(c.email||'-')}</div></div><div><b>Pendidikan</b><div>${esc(c.profile?.pendidikan||'-')}</div></div><div class="md:col-span-2"><b>Alamat</b><div>${esc(c.profile?.alamat||'-')}</div></div><div class="md:col-span-2"><b>Pengalaman</b><div>${esc(c.profile?.pengalaman||'-')}</div></div></div><div class="mt-5 p-4 bg-orange-50 border border-orange-200 rounded-xl"><div class="font-black text-orange-800 mb-2">Background Check</div><div>Status: ${esc(c.backgroundCheck?.status||'PENDING')}</div><div class="text-xs mt-2">Identity: ${esc(c.backgroundCheck?.identity||'PENDING')} · Education: ${esc(c.backgroundCheck?.education||'PENDING')} · Employment: ${esc(c.backgroundCheck?.employment||'PENDING')} · Reference: ${esc(c.backgroundCheck?.reference||'PENDING')} · Criminal: ${esc(c.backgroundCheck?.criminal||'PENDING')}</div><div class="text-sm mt-2">${esc(c.backgroundCheck?.notes||'-')}</div></div><div class="mt-5"><h4 class="font-black mb-2">Approval Timeline</h4>${renderTimeline(c)}</div>`,`<button class="btnx" onclick="openCandidateProfileEdit(${id})">Edit Profile</button><button class="btnx orange" onclick="openBackgroundCheck(${id})">Background Check</button><button class="btnx" onclick="closeModal()">Tutup</button>`)}
function renderTimeline(c){return STAGES.map(s=>{const h=(c.stageHistory||[]).filter(x=>x.stage===s.key).slice(-1)[0];return `<div class="flex gap-3 mb-3"><div class="w-7 h-7 rounded-full border flex items-center justify-center"><i class="fa ${h?.status==='APPROVED'?'fa-check':h?.status==='REJECTED'?'fa-times':s.icon}"></i></div><div><b>${esc(s.label)}</b><div class="text-xs text-gray-500">${h?esc(h.status)+' · '+fmtDate(h.at):s.key===c.stage?'Menunggu tindakan':'Belum diproses'}</div>${h?.note?`<div class="text-xs mt-1">${esc(h.note)}</div>`:''}</div></div>`}).join('')}
function openCandidateProfileEdit(id){const c=state.candidates.find(x=>String(x.id)===String(id));if(!c)return;const p=c.profile||{};openModal('Edit Profile Calon Pelamar','Perbarui data kandidat',`<div class="grid md:grid-cols-2 gap-4"><div><label>Nama</label><input id="cp_nama" class="fieldx" value="${esc(c.nama)}"></div><div><label>Nomor HP</label><input id="cp_kontak" class="fieldx" value="${esc(c.kontak)}"></div><div><label>Email</label><input id="cp_email" class="fieldx" value="${esc(c.email||'')}"></div><div><label>Posisi</label><input id="cp_posisi" class="fieldx" value="${esc(c.posisi||'')}"></div><div><label>Department</label><input id="cp_dept" class="fieldx" value="${esc(c.departemen||'')}"></div><div><label>Penempatan</label><input id="cp_place" class="fieldx" value="${esc(c.penempatan||'')}"></div><div><label>Pendidikan</label><input id="cp_edu" class="fieldx" value="${esc(p.pendidikan||'')}"></div><div><label>Tempat Lahir</label><input id="cp_birth_place" class="fieldx" value="${esc(p.tempatLahir||'')}"></div><div><label>Tanggal Lahir</label><input id="cp_birth" type="date" class="fieldx" value="${esc(p.tanggalLahir||'')}"></div><div><label>No. KTP</label><input id="cp_ktp" class="fieldx" value="${esc(p.ktp||'')}"></div><div class="md:col-span-2"><label>Alamat</label><textarea id="cp_address" class="fieldx">${esc(p.alamat||'')}</textarea></div><div class="md:col-span-2"><label>Pengalaman Kerja</label><textarea id="cp_exp" class="fieldx">${esc(p.pengalaman||'')}</textarea></div></div>`,`<button class="btnx" onclick="closeModal()">Batal</button><button class="btnx primary" onclick="saveCandidateProfile(${id})">Simpan</button>`)}
function saveCandidateProfile(id){const c=state.candidates.find(x=>String(x.id)===String(id));if(!c)return;c.nama=document.getElementById('cp_nama').value.trim();c.kontak=document.getElementById('cp_kontak').value.trim();c.email=document.getElementById('cp_email').value.trim();c.posisi=document.getElementById('cp_posisi').value.trim();c.departemen=document.getElementById('cp_dept').value.trim();c.penempatan=document.getElementById('cp_place').value.trim();c.profile={pendidikan:document.getElementById('cp_edu').value.trim(),tempatLahir:document.getElementById('cp_birth_place').value.trim(),tanggalLahir:document.getElementById('cp_birth').value,ktp:document.getElementById('cp_ktp').value.trim(),alamat:document.getElementById('cp_address').value.trim(),pengalaman:document.getElementById('cp_exp').value.trim()};saveAll();log('UPDATE CANDIDATE PROFILE',`Memperbarui ${c.nama}`);notify(`Profil ${c.nama} diperbarui.`,'success');cloud({action:'CANDIDATE_PROFILE_UPDATE',data:c});closeModal();openCandidate(id)}
function openBackgroundCheck(id){const c=state.candidates.find(x=>String(x.id)===String(id));if(!c)return;const b=c.backgroundCheck||{};openModal('Background Check Detail',`Candidate: ${esc(c.nama)}`,`<div class="grid md:grid-cols-2 gap-4"><div><label>Status Overall</label><select id="bg_status" class="fieldx"><option ${b.status==='PENDING'?'selected':''}>PENDING</option><option ${b.status==='IN_PROGRESS'?'selected':''}>IN_PROGRESS</option><option ${b.status==='CLEAR'?'selected':''}>CLEAR</option><option ${b.status==='ISSUE'?'selected':''}>ISSUE</option></select></div>${['identity','education','employment','reference','criminal'].map(k=>`<div><label>${k}</label><select id="bg_${k}" class="fieldx"><option ${b[k]==='PENDING'?'selected':''}>PENDING</option><option ${b[k]==='CLEAR'?'selected':''}>CLEAR</option><option ${b[k]==='ISSUE'?'selected':''}>ISSUE</option></select></div>`).join('')}<div class="md:col-span-2"><label>Catatan Detail</label><textarea id="bg_notes" class="fieldx" rows="5">${esc(b.notes||'')}</textarea></div></div>`,`<button class="btnx" onclick="closeModal()">Batal</button><button class="btnx orange" onclick="saveBackgroundCheck(${id})">Simpan BG Check</button>`)}
function saveBackgroundCheck(id){const c=state.candidates.find(x=>String(x.id)===String(id));if(!c)return;c.backgroundCheck={status:document.getElementById('bg_status').value,identity:document.getElementById('bg_identity').value,education:document.getElementById('bg_education').value,employment:document.getElementById('bg_employment').value,reference:document.getElementById('bg_reference').value,criminal:document.getElementById('bg_criminal').value,notes:document.getElementById('bg_notes').value.trim(),checkedAt:now(),checkedBy:state.user.name};saveAll();log('BACKGROUND CHECK UPDATE',`${c.nama}: ${c.backgroundCheck.status}`);notify(`Background Check ${c.nama} diperbarui.`,'success');cloud({action:'BACKGROUND_CHECK_UPDATE',data:c});closeModal();openCandidate(id)}
function openOffer(id,finalApproval=false){if(!canAct('OFFER_LETTER'))return toast('Tidak memiliki hak Offer Letter.','error');const c=state.candidates.find(x=>String(x.id)===String(id));if(!c)return;const o=c.offer||{};openModal('Offer Letter',`Finalisasi ${esc(c.nama)}`,`<div class="grid md:grid-cols-2 gap-4"><div><label>Tipe Kontrak</label><select id="offer_contract" class="fieldx"><option ${o.contract==='PKWT'?'selected':''}>PKWT</option><option ${o.contract==='PKWTT'?'selected':''}>PKWTT</option><option ${o.contract==='KHUSUS'?'selected':''}>KHUSUS</option></select></div><div><label>Tanggal Mulai</label><input id="offer_start" type="date" class="fieldx" value="${esc(o.start||new Date().toISOString().slice(0,10))}"></div><div><label>Gaji / Offer</label><input id="offer_salary" type="number" class="fieldx" value="${esc(o.salary||'')}"></div><div><label>Jabatan</label><input id="offer_posisi" class="fieldx" value="${esc(o.posisi||c.posisi)}"></div><div class="md:col-span-2"><label>Catatan Offer *</label><textarea id="offer_note" class="fieldx">${esc(o.note||'')}</textarea></div></div>`,`<button class="btnx" onclick="closeModal()">Batal</button><button class="btnx primary" onclick="saveOffer(${id},${finalApproval})">${finalApproval?'Approve & Lanjut Database':'Simpan Offer'}</button>`)}
function saveOffer(id,finalApproval){if(!canAct('OFFER_LETTER'))return toast('Tidak memiliki hak Offer Letter.','error');const c=state.candidates.find(x=>String(x.id)===String(id));if(!c)return;const note=document.getElementById('offer_note').value.trim();if(!note||!document.getElementById('offer_start').value||!document.getElementById('offer_posisi').value.trim())return toast('Lengkapi Offer Letter.','warning');c.offer={contract:document.getElementById('offer_contract').value,start:document.getElementById('offer_start').value,salary:document.getElementById('offer_salary').value,posisi:document.getElementById('offer_posisi').value.trim(),note,updatedAt:now(),updatedBy:state.user.name};saveAll();log('OFFER LETTER',`${c.nama}: ${c.offer.contract}`);notify(`Offer Letter ${c.nama} disimpan.`,'success');cloud({action:'OFFER_LETTER',data:c});if(finalApproval){closeModal();openEmployeeFromCandidate(id)}else{closeModal();openCandidate(id)}}
function openEmployeeFromCandidate(id){if(!canAct('OFFER_LETTER'))return toast('Tidak memiliki hak finalisasi karyawan.','error');const c=state.candidates.find(x=>String(x.id)===String(id));if(!c)return;openModal('Final Approval → Database Karyawan',`Lengkapi data ${esc(c.nama)}`,employeeFormHtml(c),`<button class="btnx" onclick="closeModal()">Batal</button><button class="btnx green" onclick="finalizeEmployee(${id})">Simpan sebagai Karyawan</button>`)}
function employeeFormHtml(c){const o=c.offer||{};return `<div class="grid md:grid-cols-3 gap-4"><div><label>NIK *</label><input id="emp_nik" class="fieldx"></div><div><label>Tanggal Join *</label><input id="emp_join" type="date" class="fieldx" value="${esc(o.start||new Date().toISOString().slice(0,10))}"></div><div><label>Status</label><select id="emp_status" class="fieldx"><option>AKTIF</option><option>NONAKTIF</option></select></div><div><label>Area</label><select id="emp_area" class="fieldx"><option>Factory</option><option>Depo</option><option>HO</option><option>RO</option></select></div><div><label>Directorate</label><input id="emp_dir" class="fieldx"></div><div><label>Division</label><input id="emp_div" class="fieldx"></div><div><label>Department</label><input id="emp_dept" class="fieldx" value="${esc(c.departemen)}"></div><div><label>Department Detail</label><input id="emp_detail" class="fieldx"></div><div><label>Level</label><input id="emp_level" class="fieldx"></div><div><label>Posisi</label><input id="emp_posisi" class="fieldx" value="${esc(o.posisi||c.posisi)}"></div><div><label>Lokasi</label><input id="emp_lokasi" class="fieldx" value="${esc(c.penempatan||'')}"></div><div><label>Status Kontrak</label><select id="emp_contract" class="fieldx"><option>PKWT</option><option>PKWTT</option><option>KHUSUS</option></select></div><div><label>No. HP</label><input id="emp_hp" class="fieldx" value="${esc(c.kontak)}"></div><div><label>Email</label><input id="emp_email" class="fieldx" value="${esc(c.email||'')}"></div><div><label>KTP</label><input id="emp_ktp" class="fieldx"></div><div><label>NPWP</label><input id="emp_npwp" class="fieldx"></div><div><label>Rekening</label><input id="emp_rek" class="fieldx"></div><div><label>Pendidikan</label><input id="emp_edu" class="fieldx" value="${esc(c.profile?.pendidikan||'')}"></div><div><label>Gender</label><select id="emp_gender" class="fieldx"><option>LAKI-LAKI</option><option>PEREMPUAN</option></select></div><div><label>Tempat Lahir</label><input id="emp_birth_place" class="fieldx"></div><div><label>Tgl Lahir</label><input id="emp_birth" type="date" class="fieldx"></div><div><label>Nama Darurat</label><input id="emp_emergency_name" class="fieldx"></div><div><label>HP Darurat</label><input id="emp_emergency_hp" class="fieldx"></div><div><label>Koperasi</label><select id="emp_koperasi" class="fieldx"><option>TIDAK MENGIKUTI</option><option>TERDAFTAR ANGGOTA</option></select></div></div>`}
function finalizeEmployee(id){if(!canAct('OFFER_LETTER'))return toast('Tidak memiliki hak finalisasi karyawan.','error');const c=state.candidates.find(x=>String(x.id)===String(id));if(!c)return;const nik=document.getElementById('emp_nik').value.trim(),join=document.getElementById('emp_join').value;if(!nik||!join)return toast('NIK dan Tanggal Join wajib.','warning');if(state.employees.some(e=>String(e.NIK).toLowerCase()===nik.toLowerCase()))return toast('NIK sudah digunakan.','error');const status=document.getElementById('emp_status').value,e={id:Date.now()+Math.floor(Math.random()*1000),NIK:nik,NAMA:c.nama,TGL_JOIN:join,STATUS_PEGAWAI:status,AREA_TYPE:document.getElementById('emp_area').value,TGL_KELUAR:'',DIRECTORATE:document.getElementById('emp_dir').value,DIVISION:document.getElementById('emp_div').value,DEPARTMENT:document.getElementById('emp_dept').value,DEPT_DETAIL:document.getElementById('emp_detail').value,LEVEL:document.getElementById('emp_level').value,POSISI:document.getElementById('emp_posisi').value,LOKASI_KERJA:document.getElementById('emp_lokasi').value,STATUS_KONTRAK:document.getElementById('emp_contract').value,NO_HP:document.getElementById('emp_hp').value,EMAIL_PRIBADI:document.getElementById('emp_email').value,NO_KTP:document.getElementById('emp_ktp').value,NPWP:document.getElementById('emp_npwp').value,NO_REKENING:document.getElementById('emp_rek').value,PENDIDIKAN:document.getElementById('emp_edu').value,JENIS_KELAMIN:document.getElementById('emp_gender').value,TEMPAT_LAHIR:document.getElementById('emp_birth_place').value,TGL_LAHIR:document.getElementById('emp_birth').value,NAMA_DARURAT:document.getElementById('emp_emergency_name').value,NO_HP_DARURAT:document.getElementById('emp_emergency_hp').value,KOPERASI:document.getElementById('emp_koperasi').value,OFFER:c.offer||null,sourceCandidate:c.id,createdAt:now()};state.employees.unshift(e);c.stage='T_POOL';c.status='HIRED';c.hiredAt=now();c.employeeId=e.id;saveAll();log('FINALIZE HIRING',`${c.nama} menjadi karyawan NIK ${nik}`);notify(`${c.nama} masuk Database Karyawan.`,'success');cloud({action:'EMPLOYEE_CREATE',data:e,candidate:c});closeModal();buildWorkflowMenu();navigate('employees')}
function employeeRows(rows){return rows.map(e=>{const kes=state.bpjsKes.find(b=>String(b.employeeId)===String(e.id)),tk=state.bpjsTK.find(b=>String(b.employeeId)===String(e.id));return `<tr class="border-t"><td class="p-3">${e.foto?`<img src="${esc(e.foto)}" class="w-10 h-10 rounded-xl object-cover">`:'<div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center"><i class="fa fa-user"></i></div>'}</td><td class="p-3 font-bold text-primary">${esc(e.NIK)}</td><td class="p-3 font-bold">${esc(e.NAMA)}</td><td class="p-3">${esc(e.POSISI)}</td><td class="p-3">${esc(e.DEPARTMENT)}</td><td class="p-3">${esc(areaType(e))}</td><td class="p-3">${esc(e.TGL_JOIN)}</td><td class="p-3">${esc(getExitDate(e)||'-')}</td><td class="p-3"><span class="badgex">${esc(e.STATUS_PEGAWAI)}</span></td><td class="p-3">${kes?.status||'-'} / ${tk?.status||'-'}</td><td class="p-3"><div class="flex gap-2 flex-wrap"><button class="btnx" onclick="viewEmployee(${e.id})">Detail</button><button class="btnx primary" onclick="openEmployeeEdit(${e.id})">Lengkapi Data</button><button class="btnx orange" onclick="openEmployeeStatus(${e.id})">Status</button></div></td></tr>`}).join('')||'<tr><td colspan="11" class="p-12 text-center text-gray-400">Database karyawan masih kosong.</td></tr>'}
function renderEmployees(){const q=window.empQuery||'',rows=state.employees.filter(e=>[e.NIK,e.NAMA,e.POSISI,e.DEPARTMENT,e.LOKASI_KERJA].join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('page-employees').innerHTML=`<div class="mb-5 flex flex-col md:flex-row md:justify-between gap-3"><div><h1 class="text-3xl font-black">Database Karyawan</h1><p class="text-sm text-gray-500">Lengkapi data, foto, status dan data aktual karyawan.</p></div><div class="flex gap-2"><button class="btnx red" onclick="openInactiveBpjsPopup(true)">Audit BPJS Nonaktif</button><button class="btnx primary" onclick="exportEmployees()">Export Excel</button></div></div><div class="bg-white rounded-2xl border overflow-auto"><div class="p-4"><input class="fieldx max-w-lg" placeholder="Cari NIK, nama, posisi, department..." value="${esc(q)}" oninput="filterEmployeesLive(this.value)"></div><table class="w-full min-w-[1380px] text-sm"><thead><tr class="bg-gray-50 text-xs uppercase text-gray-500"><th class="p-3 text-left">Foto</th><th class="p-3 text-left">NIK</th><th class="p-3 text-left">Nama</th><th class="p-3 text-left">Posisi</th><th class="p-3 text-left">Department</th><th class="p-3 text-left">Area</th><th class="p-3">Join</th><th class="p-3">Keluar</th><th class="p-3">Status</th><th class="p-3">BPJS</th><th class="p-3">Aksi</th></tr></thead><tbody id="employeeTableBody">${employeeRows(rows)}</tbody></table></div>`}
function filterEmployeesLive(v){window.empQuery=String(v||'');const tb=document.getElementById('employeeTableBody');if(tb){const q=window.empQuery.toLowerCase(),rows=state.employees.filter(e=>[e.NIK,e.NAMA,e.POSISI,e.DEPARTMENT,e.LOKASI_KERJA].join(' ').toLowerCase().includes(q));tb.innerHTML=employeeRows(rows)}}
function openEmployeeEdit(id){const e=state.employees.find(x=>String(x.id)===String(id));if(!e)return;window.pendingPhoto='';window.removePhoto=false;openModal('Lengkapi Data Karyawan',`${esc(e.NIK)} · ${esc(e.NAMA)}`,`<div class="grid md:grid-cols-3 gap-4"><div class="md:col-span-3"><label>Foto Karyawan</label><input id="emp_foto" type="file" accept="image/*" class="fieldx" onchange="previewEmployeePhoto(this)"><div id="empPhotoPreview" class="mt-2 w-28 h-28 rounded-xl overflow-hidden bg-gray-100 flex items-center justify-center">${e.foto?`<img src="${esc(e.foto)}" class="w-full h-full object-cover">`:'<i class="fa fa-user text-3xl text-gray-300"></i>'}</div><button class="btnx mt-2" onclick="clearEmployeePhoto()">Hapus Foto</button></div>${[['empEdit_nik','NIK',e.NIK],['empEdit_nama','Nama',e.NAMA],['empEdit_join','Tanggal Join',e.TGL_JOIN],['empEdit_status','Status',e.STATUS_PEGAWAI],['empEdit_area','Area',areaType(e)],['empEdit_dir','Directorate',e.DIRECTORATE],['empEdit_div','Division',e.DIVISION],['empEdit_dept','Department',e.DEPARTMENT],['empEdit_detail','Department Detail',e.DEPT_DETAIL],['empEdit_level','Level',e.LEVEL],['empEdit_posisi','Posisi',e.POSISI],['empEdit_lokasi','Lokasi',e.LOKASI_KERJA],['empEdit_contract','Status Kontrak',e.STATUS_KONTRAK],['empEdit_hp','No. HP',e.NO_HP],['empEdit_email','Email',e.EMAIL_PRIBADI],['empEdit_ktp','KTP',e.NO_KTP],['empEdit_npwp','NPWP',e.NPWP],['empEdit_rek','Rekening',e.NO_REKENING],['empEdit_edu','Pendidikan',e.PENDIDIKAN],['empEdit_gender','Gender',e.JENIS_KELAMIN],['empEdit_birth_place','Tempat Lahir',e.TEMPAT_LAHIR],['empEdit_birth','Tanggal Lahir',e.TGL_LAHIR],['empEdit_emergency_name','Nama Darurat',e.NAMA_DARURAT],['empEdit_emergency_hp','HP Darurat',e.NO_HP_DARURAT],['empEdit_koperasi','Koperasi',e.KOPERASI]].map(a=>`<div><label>${a[1]}</label><input id="${a[0]}" class="fieldx" value="${esc(a[2]||'')}"></div>`).join('')}<div class="md:col-span-3"><label>Alamat</label><textarea id="empEdit_alamat" class="f function previewEmployeePhoto(input){const f=input.files?.[0];if(!f||!f.type.startsWith('image/'))return toast('Pilih file gambar.','warning');if(f.size>5*1024*1024)return toast('Foto maksimal 5 MB.','warning');const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=800,scale=Math.min(1,max/img.width,max/img.height),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);window.pendingPhoto=c.toDataURL('image/jpeg',0.82);document.getElementById('empPhotoPreview').innerHTML=`<img src="${esc(window.pendingPhoto)}" class="w-full h-full object-cover">`;window.removePhoto=false};img.src=r.result};r.readAsDataURL(f)}

function saveEmployeeEdit(id){const e=state.employees.find(x=>String(x.id)===String(id));if(!e)return;const val=id=>document.getElementById(id)?.value||'';const nik=val('empEdit_nik').trim(),nama=val('empEdit_nama').trim();if(!nik||!nama||!val('empEdit_join'))return toast('NIK, Nama dan Join wajib.','warning');if(state.employees.some(x=>String(x.id)!==String(id)&&String(x.NIK).toLowerCase()===nik.toLowerCase()))return toast('NIK sudah digunakan.','error');e.NIK=nik;e.NAMA=nama;e.TGL_JOIN=val('empEdit_join');e.STATUS_PEGAWAI=val('empEdit_status');e.AREA_TYPE=val('empEdit_area');e.DIRECTORATE=val('empEdit_dir');e.DIVISION=val('empEdit_div');e.DEPARTMENT=val('empEdit_dept');e.DEPT_DETAIL=val('empEdit_detail');e.LEVEL=val('empEdit_level');e.POSISI=val('empEdit_posisi');e.LOKASI_KERJA=val('empEdit_lokasi');e.STATUS_KONTRAK=val('empEdit_contract');e.NO_HP=val('empEdit_hp');e.EMAIL_PRIBADI=val('empEdit_email');e.NO_KTP=val('empEdit_ktp');e.NPWP=val('empEdit_npwp');e.NO_REKENING=val('empEdit_rek');e.PENDIDIKAN=val('empEdit_edu');e.JENIS_KELAMIN=val('empEdit_gender');e.TEMPAT_LAHIR=val('empEdit_birth_place');e.TGL_LAHIR=val('empEdit_birth');e.NAMA_DARURAT=val('empEdit_emergency_name');e.NO_HP_DARURAT=val('empEdit_emergency_hp');e.KOPERASI=val('empEdit_koperasi');e.ALAMAT=val('empEdit_alamat');if(window.removePhoto)e.foto='';else if(window.pendingPhoto)e.foto=window.pendingPhoto;if(e.STATUS_PEGAWAI==='NONAKTIF'&&!e.TGL_KELUAR)e.TGL_KELUAR=now().slice(0,10);e.updatedAt=now();e.updatedBy=state.user.name;saveAll();log('UPDATE EMPLOYEE PROFILE',`Memperbarui ${e.NAMA}`);notify(`Profil ${e.NAMA} diperbarui.`,'success');cloud({action:'EMPLOYEE_UPDATE',data:e});closeModal();renderEmployees();updateAdjustmentBadges();if(e.STATUS_PEGAWAI==='NONAKTIF')openInactiveBpjsPopup(true)}
function openEmployeeStatus(id){const e=state.employees.find(x=>String(x.id)===String(id));if(!e)return;openModal('Update Status Karyawan',`${esc(e.NIK)} · ${esc(e.NAMA)}`,`<div class="grid md:grid-cols-2 gap-4"><div><label>Status</label><select id="newEmpStatus" class="fieldx"><option ${e.STATUS_PEGAWAI==='AKTIF'?'selected':''}>AKTIF</option><option ${e.STATUS_PEGAWAI==='NONAKTIF'?'selected':''}>NONAKTIF</option></select></div><div><label>Area</label><select id="empAreaType" class="fieldx"><option ${areaType(e)==='Factory'?'selected':''}>Factory</option><option ${areaType(e)==='Depo'?'selected':''}>Depo</option><option ${areaType(e)==='HO'?'selected':''}>HO</option><option ${areaType(e)==='RO'?'selected':''}>RO</option></select></div><div><label>Tanggal Keluar</label><input id="empExitDate" type="date" class="fieldx" value="${esc(getExitDate(e)||'')}"></div><div class="md:col-span-2"><label>Catatan</label><textarea id="empStatusNote" class="fieldx">${esc(e.statusNote||'')}</textarea></div></div>`,`<button class="btnx" onclick="closeModal()">Batal</button><button class="btnx orange" onclick="saveEmployeeStatus(${id})">Simpan</button>`)}
function saveEmployeeStatus(id){const e=state.employees.find(x=>String(x.id)===String(id));if(!e)return;const st=document.getElementById('newEmpStatus').value,exit=document.getElementById('empExitDate').value;if(st==='NONAKTIF'&&!exit)return toast('Tanggal keluar wajib diisi.','warning');e.STATUS_PEGAWAI=st;e.AREA_TYPE=document.getElementById('empAreaType').value;e.TGL_KELUAR=st==='NONAKTIF'?exit:'';e.statusUpdatedAt=now();e.statusUpdatedBy=state.user.name;e.statusNote=document.getElementById('empStatusNote').value.trim();saveAll();log('UPDATE EMPLOYEE STATUS',`${e.NAMA}: ${st}`);notify(`${e.NAMA} sekarang ${st}.`,st==='NONAKTIF'?'warning':'success');cloud({action:'EMPLOYEE_STATUS_UPDATE',data:e});closeModal();renderEmployees();updateAdjustmentBadges();if(st==='NONAKTIF')openInactiveBpjsPopup(true)}
function viewEmployee(id){const e=state.employees.find(x=>String(x.id)===String(id));if(!e)return;openModal('Detail Karyawan',`${esc(e.NIK)} · ${esc(e.NAMA)}`,`<div class="grid md:grid-cols-2 gap-4"><div><b>Nama</b><div>${esc(e.NAMA)}</div></div><div><b>Status</b><div>${esc(e.STATUS_PEGAWAI)}</div></div><div><b>Posisi</b><div>${esc(e.POSISI)}</div></div><div><b>Department</b><div>${esc(e.DEPARTMENT)}</div></div><div><b>Area</b><div>${esc(areaType(e))}</div></div><div><b>Join</b><div>${esc(e.TGL_JOIN)}</div></div><div><b>HP</b><div>${esc(e.NO_HP)}</div></div><div><b>Email</b><div>${esc(e.EMAIL_PRIBADI)}</div></div><div class="md:col-span-2"><b>Alamat</b><div>${esc(e.ALAMAT||'-')}</div></div></div>`,`<button class="btnx" onclick="openEmployeeEdit(${id})">Lengkapi Data</button><button class="btnx" onclick="closeModal()">Tutup</button>`)}
function renderBpjs(type){const arr=type==='KES'?state.bpjsKes:state.bpjsTK;const title=type==='KES'?'BPJS Kesehatan':'BPJS Ketenagakerjaan';document.getElementById('page-bpjs'+type==='KES'?'Kes':'TK')}
function renderBpjs(type){const arr=type==='KES'?state.bpjsKes:state.bpjsTK,el=document.getElementById('page-bpjs'+(type==='KES'?'Kes':'TK'));el.innerHTML=`<div class="mb-5 flex justify-between"><div><h1 class="text-3xl font-black">${type==='KES'?'BPJS Kesehatan':'BPJS Ketenagakerjaan'}</h1><p class="text-sm text-gray-500">Kelola nomor peserta, status dan kartu BPJS.</p></div><button class="btnx primary" onclick="openBpjsSelectEmployee('${type}')">Tambah Data</button></div><div class="bg-white rounded-2xl border overflow-auto"><table class="w-full min-w-[1050px] text-sm"><thead><tr class="bg-gray-50 text-xs uppercase text-gray-500"><th class="p-3">NIK</th><th class="p-3">Nama</th><th class="p-3">No Peserta</th><th class="p-3">Provider</th><th class="p-3">Aktif</th><th class="p-3">Status</th><th class="p-3">Kartu</th><th class="p-3">Aksi</th></tr></thead><tbody>${arr.map(b=>{const e=state.employees.find(x=>String(x.id)===String(b.employeeId));return e?`<tr class="border-t"><td class="p-3">${esc(e.NIK)}</td><td class="p-3 font-bold">${esc(e.NAMA)}</td><td class="p-3">${esc(b.nomorPeserta)}</td><td class="p-3">${esc(b.provider||'-')}</td><td class="p-3">${esc(b.tanggalAktif||'-')}</td><td class="p-3">${esc(b.status)}</td><td class="p-3">${b.cardData?'<span class="text-green-600">Ada</span>':'-'}</td><td class="p-3"><button class="btnx" onclick="openBpjsForm('${type}',${e.id})">Edit</button> ${b.cardData?`<button class="btnx" onclick="downloadBpjsCard('${type}',${b.id})">Download Kartu</button>`:''}</td></tr>`:''}).join('')||'<tr><td colspan="8" class="p-12 text-center text-gray-400">Belum ada data BPJS.</td></tr>'}</tbody></table></div>`;updateBpjsBadges()}
function updateBpjsBadges(){const a=document.getElementById('badgeBpjsKes'),b=document.getElementById('badgeBpjsTK');if(a)a.innerText=state.bpjsKes.filter(x=>x.status==='ACTIVE').length;if(b)b.innerText=state.bpjsTK.filter(x=>x.status==='ACTIVE').length}
function openBpjsSelectEmployee(type){const arr=type==='KES'?state.bpjsKes:state.bpjsTK, list=state.employees.filter(e=>!arr.some(b=>String(b.employeeId)===String(e.id)));openModal('Pilih Karyawan','Tambah data BPJS',`<input id="chooseEmployeeQ" class="fieldx mb-3" placeholder="Cari..." oninput="filterChooseEmployees('${type}')"><div id="chooseEmployeeList" class="space-y-2">${renderChooseEmployees(list,type)}</div>`,'<button class="btnx" onclick="closeModal()">Tutup</button>')}
function renderChooseEmployees(list,type){return list.map(e=>`<button class="w-full text-left border rounded-xl p-3 hover:bg-gray-50" onclick="openBpjsForm('${type}',${e.id})"><b>${esc(e.NAMA)}</b><div class="text-xs text-gray-500">${esc(e.NIK)} · ${esc(e.POSISI||'-')}</div></button>`).join('')||'<div class="text-sm text-gray-400 text-center py-5">Semua karyawan sudah mempunyai data.</div>'}
function filterChooseEmployees(type){const q=document.getElementById('chooseEmployeeQ').value.toLowerCase(),arr=type==='KES'?state.bpjsKes:state.bpjsTK,list=state.employees.filter(e=>!arr.some(b=>String(b.employeeId)===String(e.id))&&[e.NIK,e.NAMA,e.POSISI,e.DEPARTMENT].join(' ').toLowerCase().includes(q));document.getElementById('chooseEmployeeList').innerHTML=renderChooseEmployees(list,type)}
function openBpjsForm(type,employeeId){const e=state.employees.find(x=>String(x.id)===String(employeeId));if(!e)return;const arr=type==='KES'?state.bpjsKes:state.bpjsTK,old=arr.find(b=>String(b.employeeId)===String(employeeId));openModal(type==='KES'?'BPJS Kesehatan':'BPJS Ketenagakerjaan',`${esc(e.NIK)} · ${esc(e.NAMA)}`,`<div class="grid md:grid-cols-2 gap-4"><div><label>No Peserta *</label><input id="bpjs_nomor" class="fieldx" value="${esc(old?.nomorPeserta||'')}"></div><div><label>Provider</label><input id="bpjs_provider" class="fieldx" value="${esc(old?.provider||'')}"></div><div><label>Faskes / Unit</label><input id="bpjs_faskes" class="fieldx" value="${esc(old?.faskes||'')}"></div><div><label>Tanggal Aktif</label><input id="bpjs_tanggal" type="date" class="fieldx" value="${esc(old?.tanggalAktif||new Date().toISOString().slice(0,10))}"></div><div><label>Status</label><select id="bpjs_status" class="fieldx"><option ${old?.status!=='INACTIVE'?'selected':''}>ACTIVE</option><option ${old?.status==='INACTIVE'?'selected':''}>INACTIVE</option></select></div><div><label>Tanggal Nonaktif</label><input id="bpjs_nonaktif_tanggal" type="date" class="fieldx" value="${esc(old?.tanggalNonaktif||'')}"></div><div class="md:col-span-2"><label>Catatan</label><textarea id="bpjs_catatan" class="fieldx">${esc(old?.catatan||'')}</textarea></div></div><div class="mt-4"><label>Upload Kartu (PDF/JPG/PNG, max 1.8MB)</label><input id="bpjs_card" type="file" accept=".pdf,.jpg,.jpeg,.png,image/*,application/pdf" class="fieldx"><div id="bpjs_card_preview" class="text-xs text-gray-500 mt-2">${old?.cardName||'Belum ada kartu'}</div></div>`,`<button class="btnx" onclick="closeModal()">Batal</button><button class="btnx primary" onclick="saveBpjs('${type}',${employeeId},${old?.id||'null'})">Simpan</button>`)}
function saveBpjs(type,employeeId,oldId){const e=state.employees.find(x=>String(x.id)===String(employeeId)),arr=type==='KES'?state.bpjsKes:state.bpjsTK,nom=document.getElementById('bpjs_nomor').value.trim(),status=document.getElementById('bpjs_status').value;if(!nom)return toast('Nomor peserta wajib.','warning');if(status==='ACTIVE'&&e.STATUS_PEGAWAI==='NONAKTIF')return toast('Karyawan NONAKTIF tidak boleh BPJS ACTIVE.','error');const done=(data='',name='',mime='')=>{const old=arr.find(b=>String(b.id)===String(oldId)),rec={id:oldId||Date.now()+Math.floor(Math.random()*1000),employeeId,nomorPeserta:nom,provider:document.getElementById('bpjs_provider').value.trim(),faskes:document.getElementById('bpjs_faskes').value.trim(),tanggalAktif:document.getElementById('bpjs_tanggal').value,status,tanggalNonaktif:document.getElementById('bpjs_nonaktif_tanggal').value,catatan:document.getElementById('bpjs_catatan').value.trim(),cardData:data||old?.cardData||'',cardName:name||old?.cardName||'',cardType:mime||old?.cardType||'',updatedAt:now(),updatedBy:state.user.name};const i=arr.findIndex(b=>String(b.id)===String(rec.id));if(i>=0)arr[i]=rec;else arr.unshift(rec);saveAll();log('BPJS UPDATE',`${e.NAMA}: ${type}`);notify(`BPJS ${e.NAMA} diperbarui.`,'success');cloud({action:type==='KES'?'BPJS_KES_UPSERT':'BPJS_TK_UPSERT',data:rec,employee:e});closeModal();renderBpjs(type);if(e.STATUS_PEGAWAI==='NONAKTIF')openInactiveBpjsPopup(true)};const f=document.getElementById('bpjs_card')?.files?.[0];if(f){if(f.size>1800000)return toast('File kartu maksimal 1.8MB.','warning');const r=new FileReader();r.onload=()=>done(r.result,f.name,f.type);r.readAsDataURL(f)}else done()}
function downloadBpjsCard(type,id){const arr=type==='KES'?state.bpjsKes:state.bpjsTK,b=arr.find(x=>String(x.id)===String(id));if(!b?.cardData)return toast('Kartu belum tersedia.','warning');const a=document.createElement('a');a.href=b.cardData;a.download=(b.cardName||`BPJS_${type}_${b.nomorPeserta||''}`).replace(/[^a-zA-Z0-9._-]/g,'_');document.body.appendChild(a);a.click();a.remove();log('DOWNLOAD BPJS CARD',`${type}: ${b.nomorPeserta}`)}
function inactiveBpjsCases(){const out=[];[['KES',state.bpjsKes],['TK',state.bpjsTK]].forEach(([t,arr])=>arr.filter(b=>b.status==='ACTIVE').forEach(b=>{const e=state.employees.find(x=>String(x.id)===String(b.employeeId));if(e?.STATUS_PEGAWAI==='NONAKTIF')out.push({type:t,bpjs:b,employee:e})}));return out}
function openInactiveBpjsPopup(force=false){const cases=inactiveBpjsCases();if(!cases.length){if(force)toast('Tidak ada BPJS aktif milik karyawan NONAKTIF.','success');return}document.getElementById('inactiveModalBody').innerHTML=cases.map(x=>`<div class="border border-red-200 rounded-xl p-4 bg-red-50 mb-3"><div class="font-black text-red-800">${esc(x.employee.NAMA)}</div><div class="text-xs">${esc(x.employee.NIK)} · ${esc(x.employee.POSISI||'-')} · NONAKTIF</div><div class="text-xs mt-2"><b>${x.type==='KES'?'BPJS Kesehatan':'BPJS TK'}</b> · ${esc(x.bpjs.nomorPeserta||'-')}</div><div class="flex gap-2 mt-3"><button class="btnx red" onclick="markBpjsDeleted('${x.type}',${x.bpjs.id})">Hapus Keanggotaan</button><button class="btnx" onclick="closeInactiveModal();openBpjsForm('${x.type}',${x.employee.id})">Buka Data</button></div></div>`).join('');document.getElementById('inactiveModal').classList.remove('hidden');document.getElementById('inactiveModal').classList.add('flex')}
function markBpjsDeleted(type,id){const arr=type==='KES'?state.bpjsKes:state.bpjsTK,b=arr.find(x=>String(x.id)===String(id));if(!b)return;const e=state.employees.find(x=>String(x.id)===String(b.employeeId));if(!e||!confirm(`Tandai ${type} ${e.NAMA} sebagai INACTIVE?`))return;b.status='INACTIVE';b.tanggalNonaktif=now().slice(0,10);b.catatan=(b.catatan?b.catatan+' | ':'')+'Penghapusan kepesertaan karena karyawan nonaktif.';b.updatedAt=now();b.updatedBy=state.user.name;saveAll();log('BPJS DEACTIVATE',`${e.NAMA}: ${type}`);notify(`${e.NAMA}: BPJS ${type} ditandai INACTIVE.`,'success');cloud({action:type==='KES'?'BPJS_KES_DEACTIVATE':'BPJS_TK_DEACTIVATE',data:b,employee:e});renderBpjs(type);openInactiveBpjsPopup(true)}
function closeInactiveModal(){document.getElementById('inactiveModal')?.classList.add('hidden');document.getElementById('inactiveModal')?.classList.remove('flex')}
function updateAdjustmentBadges(){const a=document.getElementById('badgeAdjIn'),b=document.getElementById('badgeAdjOut');if(a)a.innerText=adjustmentRows('IN').length;if(b)b.innerText=adjustmentRows('OUT').length}
function adjustmentPeriodOptions(){const d=new Date(),arr=[];for(let i=-9;i<=6;i++){const x=new Date(d.getFullYear(),d.getMonth()+i,1),k=`${x.getFullYear()}-${pad2(x.getMonth()+1)}`;arr.push(`<option value="${k}" ${state.adjustmentPeriod===k?'selected':''}>${periodLabel(k)}</option>`)}return arr.reverse().join('')}
function renderAdjustment(type){const isIn=type==='IN',id='page-adjustment'+(isIn?'In':'Out'),rows=adjustmentRows(type),b=periodBounds(state.adjustmentPeriod);document.getElementById(id).innerHTML=`<div class="mb-5"><h1 class="text-3xl font-black">Adjustment ${type}</h1><p class="text-sm text-gray-500">Cut-off 19 bulan sebelumnya s/d 20 bulan berjalan.</p></div><div class="bg-white rounded-2xl border p-4 mb-5"><div class="grid md:grid-cols-3 gap-4"><div><label>Periode</label><select class="fieldx" onchange="state.adjustmentPeriod=this.value;renderAdjustment('${type}');updateAdjustmentBadges()">${adjustmentPeriodOptions()}</select></div><div><label>Area</label><select class="fieldx" onchange="state.adjustmentArea=this.value;renderAdjustment('${type}')"><option value="ALL">Semua Area</option><option>Factory</option><option>Depo</option><option>HO</option><option>RO</option></select></div><div><label>Pencarian</label><input id="adjQuery" class="fieldx" value="${esc(state.adjustmentQuery)}" oninput="filterAdjustmentLive('${type}',this.value)" placeholder="NIK/nama/posisi..."></div></div><div class="mt-3 text-xs bg-blue-50 p-3 rounded-xl">Periode ${esc(periodLabel(state.adjustmentPeriod))}: <b>${esc(b.start)} s/d ${esc(b.end)}</b> · <span id="adjustmentCount${type}">${rows.length} karyawan</span></div></div><div class="bg-white rounded-2xl border overflow-auto"><div class="p-4 flex justify-between"><b>Daftar Adjustment ${type}</b><button class="btnx primary" onclick="exportAdjustment('${type}')">Export Excel</button></div><table class="w-full min-w-[1100px] text-sm"><thead><tr class="bg-gray-50 text-xs uppercase text-gray-500"><th class="p-3">NIK</th><th class="p-3">Nama</th><th class="p-3">Posisi</th><th class="p-3">Department</th><th class="p-3">Area</th><th class="p-3">Tanggal</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr></thead><tbody id="adjustmentRows${type}">${adjustmentRowsHtml(rows,type)}</tbody></table></div>`;updateAdjustmentBadges()}
function adjustmentRowsHtml(rows,type){const isIn=type==='IN';return rows.map(e=>`<tr class="border-t"><td class="p-3 font-bold">${esc(e.NIK)}</td><td class="p-3 font-bold">${esc(e.NAMA)}</td><td class="p-3">${esc(e.POSISI)}</td><td class="p-3">${esc(e.DEPARTMENT)}</td><td class="p-3">${esc(areaType(e))}</td><td class="p-3">${esc(isIn?getJoinDate(e):getExitDate(e))}</td><td class="p-3">${esc(e.STATUS_PEGAWAI)}</td><td class="p-3"><button class="btnx" onclick="viewEmployee(${e.id})">Detail</button></td></tr>`).join('')||'<tr><td colspan="8" class="p-12 text-center text-gray-400">Tidak ada data.</td></tr>'}
function filterAdjustmentLive(type,v){state.adjustmentQuery=String(v||'');const rows=adjustmentRows(type),tb=document.getElementById('adjustmentRows'+type),cnt=document.getElementById('adjustmentCount'+type);if(cnt)cnt.innerText=rows.length+' karyawan';if(tb)tb.innerHTML=adjustmentRowsHtml(rows,type)}
function exportAdjustment(type){const rows=adjustmentRows(type);if(!rows.length)return toast('Tidak ada data.','warning');const out=rows.map(e=>({NIK:e.NIK,NAMA:e.NAMA,POSISI:e.POSISI,DEPARTMENT:e.DEPARTMENT,AREA:areaType(e),TANGGAL:type==='IN'?getJoinDate(e):getExitDate(e),STATUS:e.STATUS_PEGAWAI,PERIODE:state.adjustmentPeriod,CUTOFF:periodBounds(state.adjustmentPeriod).start+' s/d '+periodBounds(state.adjustmentPeriod).end}));const ws=XLSX.utils.json_to_sheet(out),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Adjustment '+type);XLSX.writeFile(wb,`Adjustment_${type}_${state.adjustmentPeriod}.xlsx`);log('EXPORT ADJUSTMENT',`${type} ${state.adjustmentPeriod}`)}
function openModal(title,sub,body,foot){document.getElementById('modalTitle').innerHTML=title;document.getElementById('modalSub').innerHTML=sub||'';document.getElementById('modalBody').innerHTML=body||'';document.getElementById('modalFoot').innerHTML=foot||'';document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex')}
function closeModal(){document.getElementById('modal')?.classList.add('hidden');document.getElementById('modal')?.classList.remove('flex')}
function closeDuplicateModal(){document.getElementById('duplicateModal')?.classList.add('hidden');document.getElementById('duplicateModal')?.classList.remove('flex')}
function renderLogs(){document.getElementById('page-logs').innerHTML='<div class="mb-5"><h1 class="text-3xl font-black">Log Aktivitas</h1></div><div class="bg-white rounded-2xl border p-5 space-y-3">'+state.logs.map(l=>`<div class="p-3 border rounded-xl"><b>${esc(l.action)}</b><div class="text-sm">${esc(l.detail)}</div><div class="text-xs text-gray-400">${esc(l.user)} · ${fmtDate(l.at)}</div></div>`).join('')+'</div>'}
function fmtDate(v){if(!v)return '-';const d=new Date(v);return isNaN(d.getTime())?String(v):d.toLocaleString('id-ID')}
function exportEmployees(){if(!state.employees.length)return toast('Tidak ada data karyawan.','warning');const ws=XLSX.utils.json_to_sheet(state.employees),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Karyawan');XLSX.writeFile(wb,'Database_Karyawan.xlsx');log('EXPORT EMPLOYEE','Export database karyawan')}
async function cloud(payload){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),7000);try{const r=await fetch(LINK_GOOGLE_SHEET_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:ctl.signal});return r.ok}catch(e){console.warn('Cloud sync dilewati',e);return false}finally{clearTimeout(t)}}
async function cloudRead(){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),7000);try{const r=await fetch(LINK_GOOGLE_SHEET_API+'?action=READ',{signal:ctl.signal,cache:'no-store'});if(!r.ok)return;const d=await r.json();if(Array.isArray(d)&&d.length){state.candidates=d.map(normalizeCandidate).filter(c=>c.nama);saveAll();buildWorkflowMenu();if(document.getElementById('page-dashboard')?.classList.contains('active'))renderDashboard()}}catch(e){console.warn('Cloud read dilewati',e)}finally{clearTimeout(t)}}
function updateStyles(){const st=document.createElement('style');st.innerHTML='.desktop-sidebar{transform:translateX(-100%)}.desktop-sidebar.open{transform:translateX(0)}.page{display:none}.page.active{display:block}.menu-item{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#cbd2da;border-radius:10px}.menu-item.active,.menu-item:hover{background:rgba(255,255,255,.08);color:#fff}.cardx{background:#fff;border:1px solid #e5e6eb;border-radius:16px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.04)}.cardx b{display:block;font-size:30px;margin-top:6px}.fieldx{width:100%;border:1px solid #dfe3ea;border-radius:10px;padding:9px 11px;margin-top:4px;outline:none}.fieldx:focus{border-color:#165dff;box-shadow:0 0 0 3px rgba(22,93,255,.08)}.btnx{border:1px solid #d9dde5;background:#fff;padding:8px 12px;border-radius:9px;font-weight:700;font-size:12px}.btnx.primary{background:#165dff;color:#fff;border-color:#165dff}.btnx.green{background:#00b42a;color:#fff;border-color:#00b42a}.btnx.orange{background:#ff7d00;color:#fff;border-color:#ff7d00}.btnx.red{background:#f53f3f;color:#fff;border-color:#f53f3f}.badgex{background:#eef0f3;border-radius:999px;padding:5px 9px;font-size:11px}.modal{background:rgba(15,18,22,.65);backdrop-filter:blur(5px)}@media(min-width:768px){.desktop-sidebar{transform:none!important}.md\\:ml-\\[300px\\]{margin-left:300px!important}}';document.head.appendChild(st)}
(function init(){updateStyles();buildApp();const root=document.getElementById('root');root.insertAdjacentHTML('beforeend',`<div id="modal" class="modal fixed inset-0 z-[320] hidden items-center justify-center p-4"><div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[92vh] overflow-hidden"><div class="p-5 border-b"><h3 id="modalTitle" class="font-black text-xl"></h3><div id="modalSub" class="text-xs text-gray-500 mt-1"></div></div><div id="modalBody" class="p-5 overflow-y-auto max-h-[70vh]"></div><div id="modalFoot" class="p-4 border-t bg-gray-50 flex justify-end gap-2 flex-wrap"></div></div></div><div id="duplicateModal" class="modal fixed inset-0 z-[330] hidden items-center justify-center p-4"><div class="bg-white rounded-2xl max-w-md w-full"><div class="p-5 border-b bg-red-50"><b class="text-red-700 text-lg">Data Duplikat / Mirip</b><p id="duplicateDesc" class="text-sm mt-1 text-gray-600"></p></div><div class="p-5 space-y-2 text-sm"><div>Data Baru: <b id="dupNewName"></b> · <span id="dupNewPhone"></span></div><div>Data Lama: <b id="dupOldName"></b> · <span id="dupOldPhone"></span></div></div><div class="p-4 bg-gray-50 flex justify-end gap-2"><button class="btnx" onclick="closeDuplicateModal()">Tutup</button><button id="dupOpenBtn" class="btnx primary">Buka Data Lama</button></div></div></div><div id="inactiveModal" class="modal fixed inset-0 z-[325] hidden items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-3xl"><div class="p-5 border-b bg-red-50"><b class="text-red-700 text-lg">Peringatan BPJS Karyawan Nonaktif</b><div class="text-sm text-gray-600">Periksa dan proses penghapusan kepesertaan.</div></div><div id="inactiveModalBody" class="p-5 max-h-[65vh] overflow-y-auto"></div><div class="p-4 border-t bg-gray-50 flex justify-end"><button class="btnx" onclick="closeInactiveModal()">Tutup</button></div></div></div>`);restore()})();
</script></body></html>
